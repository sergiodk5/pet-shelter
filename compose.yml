# Local development only. Tests do not use this - they run Postgres in-process
# via pglite, so `npm test` needs nothing running.
#
#   docker compose up -d      start
#   docker compose down       stop
#   docker compose down -v    stop and delete the data
#
# No `version:` key - it is obsolete in the Compose spec and Docker warns about it.

services:
  postgres:
    image: postgres:18-alpine
    container_name: pet-shelter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pet_shelter
    ports:
      # If another project already holds 5432, change the left-hand side and
      # update DATABASE_URL to match.
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pet_shelter"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Database UI at http://localhost:8080
  # System: PostgreSQL · Server: postgres · User/Password: postgres · Database: pet_shelter
  adminer:
    image: adminer
    container_name: pet-shelter-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
