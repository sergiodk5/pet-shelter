name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on pull requests, but let every master run finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # npm ci runs the "prepare" script; husky's docs recommend disabling hook
  # installation in CI.
  HUSKY: 0

jobs:
  ci:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Two guards over the migration folder. `drizzle-kit check` looks for a
      # journal that two branches have both written to; `drizzle-kit generate`
      # followed by a clean-tree assertion catches a table definition that was
      # edited without generating the migration for it. Neither command opens a
      # connection, so DATABASE_URL is not needed.
      - name: Check migrations
        run: npm run db:check

      # No Postgres service container: the suite runs Postgres in-process via
      # pglite, and createTestDb applies the migrations itself, per spec file.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
